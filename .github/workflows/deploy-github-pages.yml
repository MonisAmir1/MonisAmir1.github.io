name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build
        env:
          GITHUB_PAGES: "true"

      - name: Add 404 page and .nojekyll
        run: |
          cp github-pages/404.html dist/client/404.html
          touch dist/client/.nojekyll

      - name: Check all seven pages were generated
        run: |
          missing=0
          for page in \
            index.html \
            projects/cost-to-income-ratio/index.html \
            projects/strategic-business-transformation/index.html \
            projects/product-adoption-customer-retention/index.html \
            projects/compliance-process-optimisation-operational-risk-monitoring/index.html \
            projects/transportation-network-volume-forecasting-optimisation/index.html \
            projects/satellite-network-performance-service-reliability/index.html \
            404.html .nojekyll; do
            if [ -f "dist/client/$page" ]; then echo "OK   $page"; else echo "MISSING $page"; missing=1; fi
          done
          if grep -rl "__l5e" dist/client --include=*.html --include=*.js; then
            echo "Found Lovable-hosted media references"; missing=1
          fi
          exit $missing

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
